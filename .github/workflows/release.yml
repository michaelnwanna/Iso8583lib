name: Release

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project csharp/tests/Iso8583.Core.Tests -c Release
      - run: dotnet pack csharp/src/Iso8583.Core/Iso8583.Core.csproj -c Release -o artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --verify-tag --title "ISO 8583 Core $GITHUB_REF_NAME" --notes-file docs/release-v0.1.0.md